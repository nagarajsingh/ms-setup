apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-setup-backend
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-setup-backend
  template:
    metadata:
      labels:
        app: ms-setup-backend
    spec:
      serviceAccountName: az-devops-deployment
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: backend
          image: mashrequae.azurecr.io/ms-setup-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ms-setup-config
          env:
            - name: AZDO_PAT
              valueFrom:
                secretKeyRef:
                  name: ms-setup-secret
                  key: AZDO_PAT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ms-setup-secret
                  key: JWT_SECRET
            - name: DEVOPS_APPROVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-setup-secret
                  key: DEVOPS_APPROVER_PASSWORD
          volumeMounts:
            - name: ms-service-storage
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: ms-service-storage
          persistentVolumeClaim:
            claimName: ms-service-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ms-setup-backend
  namespace: automation
spec:
  type: ClusterIP
  selector:
    app: ms-setup-backend
  ports:
    - name: http
      port: 8000
      targetPort: http

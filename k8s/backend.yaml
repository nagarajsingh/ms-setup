apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ms-setup-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-setup-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-setup-backend
  template:
    metadata:
      labels:
        app: ms-setup-backend
    spec:
      serviceAccountName: az-devops-deployment
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: backend
          image: mashrequae.azurecr.io/ms-setup-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PROVISION_MODE
              value: live
            - name: AZDO_ORG
              value: MashreqCorpTech
            - name: AZDO_PROJECT
              value: Titan
            - name: CORS_ORIGINS
              value: "*"
            - name: AZDO_PAT
              valueFrom:
                secretKeyRef:
                  name: ms-setup-secret
                  key: AZDO_PAT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ms-setup-secret
                  key: JWT_SECRET
            - name: DEVOPS_APPROVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-setup-secret
                  key: DEVOPS_APPROVER_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ms-setup-data
---
apiVersion: v1
kind: Service
metadata:
  name: ms-setup-backend
  namespace: default
spec:
  selector:
    app: ms-setup-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000

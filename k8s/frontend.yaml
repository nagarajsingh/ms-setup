apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-setup-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-setup-frontend
  template:
    metadata:
      labels:
        app: ms-setup-frontend
    spec:
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: frontend
          image: mashrequae.azurecr.io/ms-setup-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ms-setup-frontend
  namespace: default
spec:
  selector:
    app: ms-setup-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Microservice Setup Portal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">MS Setup</div>
      <p>Microservice onboarding portal</p>
      <div id="userCard" class="user-card hidden"></div>
      <button id="logoutBtn" class="secondary hidden">Logout</button>
    </aside>
    <main>
      <section id="loginView" class="panel auth-panel">
        <h1>Welcome</h1>
        <p>Login as a developer or DevOps approver.</p>
        <form id="loginForm">
          <label>Username<input name="username" required /></label>
          <label>Password<input name="password" type="password" required /></label>
          <label>Role<select name="role"><option value="DEVELOPER">Developer</option><option value="DEVOPS">DevOps</option></select></label>
          <button type="submit">Login</button>
        </form>
        <small>Default DevOps password for local testing: devops123</small>
      </section>

      <section id="appView" class="hidden">
        <header class="page-header">
          <div><h1>Microservice Requests</h1><p>Submit, review, approve and provision services.</p></div>
          <button id="newRequestBtn">New request</button>
        </header>

        <section id="stats" class="stats"></section>
        <section class="panel">
          <div class="toolbar"><input id="searchBox" placeholder="Search service, namespace or owner" /><button id="refreshBtn" class="secondary">Refresh</button></div>
          <div id="requestList" class="request-list"></div>
        </section>
      </section>
    </main>
  </div>

  <dialog id="requestDialog">
    <form id="requestForm" method="dialog">
      <div class="dialog-head"><h2>New microservice request</h2><button type="button" class="icon" data-close>×</button></div>
      <div class="grid">
        <label>Service name<input name="serviceName" placeholder="payment-validation-service" required /></label>
        <label>Namespace<input name="namespace" placeholder="h2h-dev" required /></label>
        <label>Container port<input name="containerPort" type="number" value="8080" required /></label>
        <label>Service port<input name="servicePort" type="number" value="8080" required /></label>
        <label>Ingress name<input name="ingressName" placeholder="h2h-dev-ingress" required /></label>
        <label>Ingress host<input name="ingressHost" placeholder="h2h-dev.example.com" /></label>
        <label class="full">Ingress path<input name="ingressPath" placeholder="/payment-validation-service" /></label>
        <label class="full">Description<textarea name="description" rows="3"></textarea></label>
        <label class="check full"><input id="databaseRequired" name="databaseRequired" type="checkbox" /> Database required</label>
        <div id="dbFields" class="db-fields full hidden">
          <label>Database type<select name="databaseType"><option>Oracle</option><option>PostgreSQL</option><option>SQL Server</option><option>MySQL</option></select></label>
          <label>Database name<input name="databaseName" /></label>
          <label>Schema name<input name="schemaName" /></label>
          <label>Database username<input name="databaseUsername" /></label>
        </div>
      </div>
      <div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button type="submit">Submit request</button></div>
    </form>
  </dialog>

  <dialog id="actionDialog">
    <form id="actionForm" method="dialog">
      <div class="dialog-head"><h2 id="actionTitle">Review request</h2><button type="button" class="icon" data-close>×</button></div>
      <input type="hidden" name="requestId" />
      <label>Comment<textarea name="comment" rows="4" placeholder="Approval or rejection notes"></textarea></label>
      <div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button id="rejectBtn" type="button" class="danger">Reject</button><button id="approveBtn" type="button">Approve & provision</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
